# New MGAI resources only; never import or replace ParaRadar/NOORÉ services.
# Billing is incurred only when the owner creates this Blueprint in Render.
envVarGroups:
  - name: mgai-production-shared
    envVars:
      - key: MGAI_DB_APP_PASSWORD
        generateValue: true
      - key: DATA_ENCRYPTION_SECRET
        generateValue: true
      - key: LOCAL_DEV
        value: "false"
      - key: COMMERCIAL_MODE
        value: "false"
      - key: GLOBAL_DAILY_REQUESTS
        value: "100"
      - key: GLOBAL_DAILY_USD_LIMIT
        value: "5.00"

databases:
  - name: mgai-postgres
    databaseName: mgai
    user: mgai_owner
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: [] # Private-only; migrations run inside Render.

services:
  - type: web
    name: mgai-api
    runtime: docker
    repo: https://github.com/muro5241/muro5241-mgai-ai-platform
    branch: feat/saas-mvp
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /ready
    envVars:
      - fromGroup: mgai-production-shared
      - key: PGHOST
        fromDatabase: {name: mgai-postgres, property: host}
      - key: PGPORT
        fromDatabase: {name: mgai-postgres, property: port}
      - key: PGDATABASE
        fromDatabase: {name: mgai-postgres, property: database}
      - key: PGSSLMODE
        value: require
      - key: NVIDIA_API_KEY
        sync: false

  - type: worker
    name: mgai-worker
    runtime: docker
    repo: https://github.com/muro5241/muro5241-mgai-ai-platform
    branch: feat/saas-mvp
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m mgai.worker
    autoDeploy: false
    envVars:
      - fromGroup: mgai-production-shared
      - key: PGHOST
        fromDatabase: {name: mgai-postgres, property: host}
      - key: PGPORT
        fromDatabase: {name: mgai-postgres, property: port}
      - key: PGDATABASE
        fromDatabase: {name: mgai-postgres, property: database}
      - key: PGSSLMODE
        value: require
      - key: NVIDIA_API_KEY
        sync: false

  # Dedicated migration task. Owner credentials never enter API/worker containers.
  # Trigger once manually after DB creation, and for later approved releases.
  - type: cron
    name: mgai-migrations
    runtime: docker
    repo: https://github.com/muro5241/muro5241-mgai-ai-platform
    branch: feat/saas-mvp
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m mgai.migrate
    autoDeploy: false
    schedule: "0 0 1 1 *" # Annual UTC fallback; releases require an explicit Run.
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: mgai-postgres, property: connectionString}
      - key: MGAI_DB_APP_PASSWORD
        fromService:
          name: mgai-api
          type: web
          envVarKey: MGAI_DB_APP_PASSWORD
