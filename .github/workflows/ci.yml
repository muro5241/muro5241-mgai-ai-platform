name: MGAI tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: mgai_owner
          POSTGRES_PASSWORD: ci-test-only-owner-password
          POSTGRES_DB: mgai_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mgai_owner -d mgai_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MGAI_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://mgai_owner:ci-test-only-owner-password@127.0.0.1:5432/mgai_test
      MGAI_TEST_DATABASE_URL: postgresql+psycopg://mgai_app:ci-test-only-runtime-password@127.0.0.1:5432/mgai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/run_checks.py --external
      - name: Validate production Compose without displaying secrets
        run: |
          python scripts/init_production_env.py --hostname mgai.ci-validation.com --email ci@ci-validation.com
          docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml config --quiet
      - run: docker build -t mgai-ai-platform:local .
      - run: python scripts/compose_smoke.py
